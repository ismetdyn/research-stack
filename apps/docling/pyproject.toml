[project]
name = "research-docling"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling",
    "torch",
    "torchvision",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
