[project]
name = "research-harvester"
version = "0.1.0"
description = "Multi-source open science research harvester"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<0.29",
    "httpcore>=1.0,<2",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13.9",
    "rapidfuzz>=3.10",
    "psycopg[binary]>=3.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
]

[project.scripts]
research-harvest = "research_harvester.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_harvester"]
